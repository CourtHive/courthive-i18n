name: ci

# Mirrors the structure of provider-config / courthive-components CI:
# install with pnpm, run the four gates, then build. The compare-keys
# step is the hard parity gate — any key drift across locales fails
# the build.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: lint + types + key parity + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A pnpm that does not match this repo's `packageManager` pin writes an `@pnpm/exe` block
      # into the lockfile; a pnpm that DOES match strips it out again. Committed, it makes every
      # correctly-provisioned checkout permanently dirty and drowns real work in `git status`. It was
      # cleaned out of six repos on 2026-09-08 and reappeared in two working trees the same
      # afternoon, so the committed state needs a guard rather than vigilance.
      #
      # The pattern excludes `@pnpm/exe.<platform>` — those are legitimate optional deps of `pnpm`
      # itself and every clean lockfile holds 24 of them, so the obvious grep fails every repo.
      - name: Lockfiles must not carry an @pnpm/exe block
        run: |
          locks=$(git ls-files '*pnpm-lock.yaml')
          if [ -z "$locks" ]; then
            echo "::error::no tracked pnpm-lock.yaml found — this check would pass vacuously"
            exit 1
          fi
          bad=0
          while IFS= read -r f; do
            if grep -qE "@pnpm/exe[^.]" "$f"; then
              echo "::error file=$f::$f carries an @pnpm/exe block, written only by a pnpm that does not match this repo's packageManager pin. Reinstall with the pinned pnpm and commit the lockfile."
              bad=1
            fi
          done <<LOCKS
          $locks
          LOCKS
          exit $bad

      - uses: pnpm/action-setup@v6
        # pnpm version is resolved from package.json's `packageManager` field.
        # Specifying `version:` here too makes the action error out with
        # "Multiple versions of pnpm specified" (ERR_PNPM_BAD_PM_VERSION).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - name: Compare keys across locales (parity gate)
        run: node scripts/compare-keys.cjs
      - run: pnpm build
      - name: Sanity check generated manifest
        run: |
          test -f dist/manifest.json
          test -f dist/locale-labels.js
          node -e "const m = JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')); if (!m.locales.length) { console.error('empty manifest'); process.exit(1); }"
      # Also chained into `pnpm build`; named here so a failure reads as its own
      # step rather than a build error. A shipped `__TODO__` renders literally
      # instead of falling back to English — see scripts/check-dist-no-todo.cjs.
      - name: No __TODO__ sentinel in published locales
        run: node scripts/check-dist-no-todo.cjs
